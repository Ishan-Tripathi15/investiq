services:
  - type: web
    name: investiq-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      - key: DATABASE_URL
        fromDatabase:
          name: investiq-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: investiq-redis
          type: keyvalue
          property: connectionString

      - key: AUTH_JWT_SECRET
        generateValue: true

      - key: DATA_ENCRYPTION_KEY
        generateValue: true

      - key: TWELVE_DATA_API_KEY
        sync: false

      - key: AUTH_JWT_ISSUER
        value: investiq-api
      - key: AUTH_JWT_AUDIENCE
        value: investiq-mobile
      - key: AUTH_ACCESS_TTL_SECONDS
        value: 900
      - key: AUTH_REFRESH_TTL_SECONDS
        value: 2592000
      - key: TWELVE_DATA_BASE_URL
        value: https://api.twelvedata.com
      - key: MARKET_DATA_TIMEOUT_MS
        value: 8000
      - key: MARKET_DATA_CACHE_TTL_SECONDS
        value: 300

  - type: keyvalue
    name: investiq-redis
    plan: free
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow connections

databases:
  - name: investiq-db
    databaseName: investiq
    user: investiq
    plan: free
    region: singapore
    postgresMajorVersion: "18"

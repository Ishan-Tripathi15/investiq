name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed API base URL, e.g. https://api.example.com"
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production smoke checks
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/production-smoke.mjs
